# Боевой nginx для car-on-time.ru.
# Закрывает пункты PageSpeed и вебмастеров, которые делаются только на сервере:
# HTTPS и один адрес сайта (без www), HTTP/2, сжатие, долгий кэш статики.
# Пути к сертификату, php-fpm и корню проекта поправьте под свой сервер.

# http:// и www — одним 301 на https://car-on-time.ru
server {
    listen 80;
    listen [::]:80;
    server_name car-on-time.ru www.car-on-time.ru;
    return 301 https://car-on-time.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.car-on-time.ru;

    ssl_certificate     /etc/letsencrypt/live/car-on-time.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/car-on-time.ru/privkey.pem;

    return 301 https://car-on-time.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name car-on-time.ru;

    root /var/www/car-on-time/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/car-on-time.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/car-on-time.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Заголовки безопасности (nosniff, Referrer-Policy, frame-ancestors, HSTS) ставит само приложение —
    # App\Http\Middleware\SecurityHeaders, чтобы они были и на обычном хостинге. Здесь их не дублируем:
    # X-Frame-Options от nginx сломал бы Вебвизор Яндекс Метрики.

    # Сжатие текста. Если собран модуль brotli — раскомментируйте блок ниже (ещё −15–20%).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json
               application/manifest+json image/svg+xml font/woff2;
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/xml application/javascript application/json
    #              application/manifest+json image/svg+xml;

    # Сборка Vite: имена файлов с хешем — кэш на год
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Картинки и иконки — месяц
    location ~* \.(?:webp|avif|jpe?g|png|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # robots.txt, sitemap.xml и старые адреса *.php отдаёт Laravel
    location = /robots.txt { try_files /index.php?$query_string =404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Старый сайт на PHP: booking.php?carid=… и т. п. — 301 делает приложение (Редиректы в админке)
    location ~ \.php$ {
        try_files $uri /index.php?$query_string;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20m;
}
