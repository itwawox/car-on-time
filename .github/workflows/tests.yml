# Проверка кода на каждом Pull Request и пуше: форматирование, статанализ, тесты, уязвимости в библиотеках.
# Выкладка (deploy.yml) вызывает этот же набор и не запускается, если что-то красное.
name: Тесты

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, pdo_sqlite, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Библиотеки
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --no-audit --no-fund

      - name: Сборка стилей
        run: npm run build

      - name: Окружение
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Форматирование (Pint)
        run: ./vendor/bin/pint --test

      - name: Статанализ (Larastan)
        run: ./vendor/bin/phpstan --no-progress --memory-limit=1G

      - name: Тесты (Pest)
        run: ./vendor/bin/pest

      - name: Уязвимости в библиотеках PHP
        run: composer audit

      - name: Уязвимости в библиотеках JS
        run: npm audit --audit-level=high
